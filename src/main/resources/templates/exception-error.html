<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bitplane</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-6 py-12">

    <section
            class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm transition-transform transition-shadow hover:-translate-y-1 hover:shadow-md md:p-10">

        <p class="text-sm font-medium uppercase tracking-[0.2em] text-slate-500">
            Exception
        </p>

        <h1 class="mt-3 text-4xl font-bold tracking-tight">
            Sorry, the request could not be processed
        </h1>

        <p class="mt-4 max-w-xl text-base leading-7 text-slate-600"
           th:text="${errorMessage}">
            Sorry, either the backend is down or the file is corrupted.
            Please try again in a moment with a valid file or return to the home page and try again.
        </p>

        <div class="mt-8 flex flex-wrap gap-3">
            <a href="/"
               class="inline-flex items-center justify-center rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm transition-all hover:-translate-y-0.5 hover:bg-slate-700 hover:shadow-md">
                ← Back Home
            </a>
        </div>

    </section>

</main>
</body>

</html>
