<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bitplane</title>
</head>
<body>
<h1>Bitplane</h1>

<section>
    <h2>Encode</h2>
    <form method="post" action="/api/v1/codec/encode" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Encode file to video</button>
    </form>
</section>

<section>
    <h2>Decode</h2>
    <form method="post" action="/api/v1/codec/decode" enctype="multipart/form-data">
        <input type="file" name="video" accept="video/*" required>
        <button type="submit">Decode video to file</button>
    </form>
</section>
</body>
</html>
