<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bitplane</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">
<header class="absolute right-0 top-0 z-10 p-6">
    <a class="inline-flex items-center gap-2 text-sm text-slate-900 transition-colors hover:text-slate-800"
       href="https://github.com/sathwikhbhat/bitplane" target="_blank" rel="noreferrer">
        <svg aria-hidden="true" class="h-3.5 w-3.5 fill-current" viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.09.68-.22.68-.48 0-.24-.01-1.04-.02-1.89-2.78.62-3.37-1.19-3.37-1.19-.46-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.52 1.06 1.52 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.56-1.13-4.56-5.02 0-1.11.38-2.02 1-2.73-.1-.26-.43-1.32.1-2.75 0 0 .82-.27 2.7 1.04A9.15 9.15 0 0 1 12 6.84c.83 0 1.67.12 2.45.34 1.87-1.31 2.69-1.04 2.69-1.04.53 1.43.2 2.49.1 2.75.62.71 1 1.62 1 2.73 0 3.9-2.34 4.76-4.57 5.01.36.32.68.94.68 1.89 0 1.36-.01 2.46-.01 2.79 0 .26.18.57.69.47A10.27 10.27 0 0 0 22 12.26C22 6.58 17.52 2 12 2Z"/>
        </svg>
        <span>GitHub</span>
    </a>
</header>
<main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center px-6 py-12">
    <header class="mb-10">
        <h1 class="text-4xl font-bold tracking-tight">Bitplane</h1>
        <p class="mt-3 text-slate-600">Encode files into videos and decode videos back into files.</p>
    </header>

    <div class="grid gap-6 md:grid-cols-2">
        <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="text-xl font-semibold">Encode</h2>
            <form class="mt-5 space-y-4" method="post" action="/api/v1/codec/encode" enctype="multipart/form-data">
                <div class="flex items-center overflow-hidden rounded-md border border-slate-300 bg-white text-sm">
                    <label for="encode-file"
                           class="cursor-pointer bg-slate-900 px-4 py-2 font-medium whitespace-nowrap text-white hover:bg-slate-700">
                        Choose file
                    </label>
                    <span id="encode-file-name"
                          class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap px-4 text-slate-600">
                            No file chosen
                        </span>
                    <input id="encode-file" class="hidden" type="file" name="file" required>
                </div>
                <button class="w-full cursor-pointer rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700"
                        type="submit">
                    Encode file to video
                </button>
            </form>
        </section>

        <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
            <h2 class="text-xl font-semibold">Decode</h2>
            <form class="mt-5 space-y-4" method="post" action="/api/v1/codec/decode" enctype="multipart/form-data">
                <div class="flex items-center overflow-hidden rounded-md border border-slate-300 bg-white text-sm">
                    <label for="decode-video"
                           class="cursor-pointer bg-slate-900 px-4 py-2 font-medium whitespace-nowrap text-white hover:bg-slate-700">
                        Choose file
                    </label>
                    <span id="decode-video-name"
                          class="min-w-0 flex-1 overflow-hidden text-ellipsis whitespace-nowrap px-4 text-slate-600">
                            No file chosen
                        </span>
                    <input id="decode-video" class="hidden" type="file" name="video" accept="video/*" required>
                </div>
                <button class="w-full cursor-pointer rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700"
                        type="submit">
                    Decode video to file
                </button>
            </form>
        </section>
    </div>
</main>
<script>
    function bindFileName(inputId, nameId) {
        const input = document.getElementById(inputId);
        const name = document.getElementById(nameId);

        input.addEventListener('change', () => {
            const file = input.files[0];

            name.textContent = file ? file.name : 'No file chosen';
            name.title = file ? file.name : '';
        });
    }

    bindFileName('encode-file', 'encode-file-name');
    bindFileName('decode-video', 'decode-video-name');
</script>
</body>

</html>
